<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulateur de coûts Azure</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">
  <h1>Simulateur de coûts Azure</h1>
  <p class="subtitle">Tarifs récupérés en direct via l'API Azure Retail Prices (mise en cache locale).</p>

  <section class="card">
    <div class="global-params">
      <label>
        Région
        <select id="region"></select>
      </label>
      <label>
        Devise
        <select id="currency"></select>
      </label>
    </div>

    <div class="line-builder">
      <label>
        Service
        <select id="service"></select>
      </label>

      <div id="dynamic-fields" class="dynamic-fields"></div>

      <label class="quantity-field">
        Quantité
        <input type="number" id="quantity" value="1" min="0.01" step="1">
      </label>

      <button id="add-line" type="button">+ Ajouter la ligne</button>
    </div>
  </section>

  <section class="card">
    <h2>Lignes de l'estimation</h2>
    <table id="lines-table">
      <thead>
        <tr>
          <th>Ressource</th>
          <th>Qté</th>
          <th>Prix unitaire</th>
          <th>Coût mensuel</th>
          <th>Coût annuel</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="lines-body"></tbody>
    </table>
    <p id="empty-state" class="empty-state">Aucune ligne pour l'instant. Ajoute une ressource ci-dessus.</p>
  </section>

  <section class="card totals">
    <div>
      <span class="total-label">Total mensuel estimé</span>
      <span class="total-value" id="total-monthly">–</span>
    </div>
    <div>
      <span class="total-label">Total annuel estimé</span>
      <span class="total-value" id="total-annual">–</span>
    </div>
    <div class="export-buttons">
      <button id="export-json" type="button">Exporter JSON</button>
      <button id="export-csv" type="button">Exporter CSV</button>
    </div>
  </section>
</div>

<script src="/static/app.js"></script>
</body>
</html>
